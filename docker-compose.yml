name: inventario-devops

services:
  mysql:
    image: mysql:8.0
    container_name: inventario-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: inventario
      TZ: America/Lima
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-prootpass']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      # Overrides explicitos para el entorno Docker local.
      # Los secretos (DB_PASSWORD, JWT_SECRET, BOOTSTRAP_SECRET) deben ir en backend/.env
      PORT: 3001
      CORS_ORIGIN: "*"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_NAME: inventario
      DB_TIMEZONE: America/Lima
      ML_SERVICE_URL: http://ml-service:5001
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: inventario-ml
    restart: unless-stopped
    ports:
      - '5001:5001'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    container_name: inventario-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  mysql_data:
