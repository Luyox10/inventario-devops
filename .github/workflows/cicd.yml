name: CI-CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-frontend

jobs:

  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
 
      - name: Install root dependencies
        run: npm ci
 
      - name: Install backend dependencies
        run: npm ci --prefix backend
 
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
 
      - name: Run backend tests
        run: npm run test --prefix backend
 
      - name: Run frontend tests
        run: npm run test --prefix frontend
 
      - name: Build frontend
        run: npm run build --prefix frontend
 
      - name: Audit backend dependencies
        run: npm audit --prefix backend --audit-level=high
 
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: quality-gates


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build backend
        run: npm ci --prefix backend

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Extract frontend metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:3001
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
  deploy:
    name: Deploy simulation
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy completed
        run: echo "Aplicación desplegada correctamente"
          
  monitor-pipeline:
    name: Monitor pipeline status
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - build-and-push
      - deploy
    if: always()
 
    steps:
      - name: Show pipeline information
        run: |
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Ejecutado por: ${{ github.actor }}"
          echo "Resultado quality-gates: ${{ needs.quality-gates.result }}"
          echo "Resultado build-and-push: ${{ needs.build-and-push.result }}"
          echo "Resultado deploy: ${{ needs.deploy.result }}"
 
      - name: Notify successful pipeline
        if: needs.quality-gates.result == 'success' && needs.build-and-push.result == 'success' && needs.deploy.result == 'success'
        run: echo "Pipeline CI/CD finalizado correctamente."
 
      - name: Notify failed pipeline
        if: needs.quality-gates.result == 'failure' || needs.build-and-push.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "El pipeline falló. Revisar logs en GitHub Actions."
          exit 1

  blue-green-deploy:
    name: Blue-Green deployment simulation
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Deploy green environment
        run: echo "Desplegando nueva versión en ambiente Green"

      - name: Run health check on green
        run: echo "Validando ambiente Green antes de enviar tráfico"

      - name: Switch traffic from Blue to Green
        run: echo "Cambiando tráfico de Blue a Green"

      - name: Rollback to Blue if needed
        if: failure()
        run: echo "Error detectado. Regresando tráfico a Blue"

  canary-deploy:
    name: Canary deployment simulation
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Deploy canary version
        run: echo "Desplegando nueva versión Canary"

      - name: Send 10 percent traffic to canary
        run: echo "Enviando 10% del tráfico a Canary"

      - name: Validate canary metrics
        run: echo "Validando métricas, errores y logs de Canary"

      - name: Promote canary to 100 percent
        run: echo "Promoviendo Canary al 100% del tráfico"

      - name: Rollback canary if needed
        if: failure()
        run: echo "Error detectado. Cancelando Canary y manteniendo versión estable"
