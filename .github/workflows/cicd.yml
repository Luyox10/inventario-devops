name: CI-CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-frontend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
 
      - name: Install root dependencies
        run: npm ci
 
      - name: Install backend dependencies
        run: npm ci --prefix backend
 
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
 
      - name: Run backend tests
        run: npm run test --prefix backend
 
      - name: Run frontend tests
        run: npm run test --prefix frontend
 
      - name: Build frontend
        run: npm run build --prefix frontend
 
      - name: Audit backend dependencies
        run: npm audit --prefix backend --audit-level=high
 
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/ devops/kubernetes/
          config_file: .yamllint

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f devops/kubernetes/

  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: quality-gates


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build backend
        run: npm ci --prefix backend

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Extract frontend metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:3001
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
  deploy:
    name: Deploy simulation
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy completed
        run: echo "Aplicación desplegada correctamente"
          
  monitor-pipeline:
    name: Monitor pipeline status
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - build-and-push
      - deploy
    if: always()
 
    steps:
      - name: Show pipeline information
        run: |
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Ejecutado por: ${{ github.actor }}"
          echo "Resultado quality-gates: ${{ needs.quality-gates.result }}"
          echo "Resultado build-and-push: ${{ needs.build-and-push.result }}"
          echo "Resultado deploy: ${{ needs.deploy.result }}"
 
      - name: Notify successful pipeline
        if: needs.quality-gates.result == 'success' && needs.build-and-push.result == 'success' && needs.deploy.result == 'success'
        run: echo "Pipeline CI/CD finalizado correctamente."
 
      - name: Notify failed pipeline
        if: needs.quality-gates.result == 'failure' || needs.build-and-push.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "El pipeline falló. Revisar logs en GitHub Actions."
          exit 1
