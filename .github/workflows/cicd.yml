name: CI-CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-frontend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run backend tests
        run: npm run test --prefix backend

      - name: Run frontend tests
        run: npm run test --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Audit backend dependencies
        run: npm audit --prefix backend --audit-level=high

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
        continue-on-error: true

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
        continue-on-error: true

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/ devops/kubernetes/
          config_file: .yamllint
        continue-on-error: true

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()

      - name: Validate Kubernetes manifests
        run: |
          kubectl version --client
          kubectl apply --dry-run=client -f devops/kubernetes/
        continue-on-error: true

  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build backend
        run: npm ci --prefix backend

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Extract frontend metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:3001
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

  terraform-validation:
    name: Terraform Validation and Plan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -recursive
        working-directory: ./terraform
        continue-on-error: true

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./terraform
        continue-on-error: true


  deploy:
    name: Deploy simulation (Render)
    needs: terraform-validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy completed
        run: |
          echo "Terraform validado correctamente"
          echo "Build y push de imágenes completado"
          echo "Render realiza el despliegue automático desde GitHub"


  monitor-pipeline:
    name: Monitor pipeline status
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - build-and-push
      - terraform-validation
      - deploy
    if: always()

    steps:
      - name: Show pipeline information
        run: |
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Ejecutado por: ${{ github.actor }}"
          echo "Resultado quality-gates: ${{ needs.quality-gates.result }}"
          echo "Resultado build-and-push: ${{ needs.build-and-push.result }}"
          echo "Resultado terraform-validation: ${{ needs.terraform-validation.result }}"
          echo "Resultado deploy: ${{ needs.deploy.result }}"

      - name: Notify successful pipeline
        if: needs.quality-gates.result == 'success' &&
            needs.build-and-push.result == 'success' &&
            needs.terraform-validation.result == 'success' &&
            needs.deploy.result == 'success'
        run: echo "Pipeline CI/CD finalizado correctamente."

      - name: Notify failed pipeline
        if: needs.quality-gates.result == 'failure' ||
            needs.build-and-push.result == 'failure' ||
            needs.terraform-validation.result == 'failure' ||
            needs.deploy.result == 'failure'
        run: |
          echo "El pipeline falló. Revisar logs en GitHub Actions."
          exit 1 
