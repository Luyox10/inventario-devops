name: CI-CD with DevSecOps

on:
  push:
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/inventario-frontend

jobs:

  # -------------------------------------------------------------------------
  # 1. Quality gates: tests, builds y npm audit
  # -------------------------------------------------------------------------
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create backend .env for CI
        working-directory: backend
        run: |
          cat > .env <<EOF
          PORT=3001
          CORS_ORIGIN=*
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=${{ secrets.CI_DB_PASSWORD || 'rootpass' }}
          DB_NAME=inventario
          DB_TIMEZONE=America/Lima
          DB_SSL_REQUIRED=false
          JWT_SECRET=${{ secrets.CI_JWT_SECRET || 'ci_jwt_secret_change_me' }}
          JWT_EXPIRES_IN=1d
          BOOTSTRAP_SECRET=${{ secrets.CI_BOOTSTRAP_SECRET || 'ci_bootstrap_secret_change_me' }}
          ML_SERVICE_URL=http://localhost:5001
          EOF

      - name: Run backend tests
        run: npm run test -w backend

      - name: Run frontend tests
        run: npm run test -w frontend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Audit backend dependencies
        run: npm audit -w backend --audit-level=critical
        continue-on-error: true

      - name: Audit frontend dependencies
        run: npm audit -w frontend --audit-level=critical
        continue-on-error: true

  # -------------------------------------------------------------------------
  # 2. Secret scanning: detecta secretos expuestos en el código
  # -------------------------------------------------------------------------
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --exclude-paths=trufflehog-exclude.txt

  # -------------------------------------------------------------------------
  # 3. Snyk: vulnerabilidades en dependencias (SCA)
  # -------------------------------------------------------------------------
  snyk-backend:
    name: Snyk - Backend dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check backend for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/package.json --project-name=inventario-backend

      - name: Upload Snyk backend report (SARIF)
        uses: snyk/actions/node@master
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/package.json --sarif-file-output=snyk-backend.sarif
          command: test

      - name: Upload backend SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk-backend.sarif
          category: snyk-backend

  # -------------------------------------------------------------------------
  # 4. SonarQube: calidad de código y análisis estático de seguridad (SAST)
  # -------------------------------------------------------------------------
  sonar-backend:
    name: SonarQube - Backend analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test -w backend

      - name: Verify SonarCloud secrets are present
        run: |
          echo "SONAR_HOST_URL present: ${{ secrets.SONAR_HOST_URL != '' }}"
          echo "SONAR_TOKEN present: ${{ secrets.SONAR_TOKEN != '' }}"

      - name: SonarQube scan - Backend
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # -------------------------------------------------------------------------
  # 5. Trivy: escaneo de vulnerabilidades en imágenes Docker
  # -------------------------------------------------------------------------
  trivy-scan:
    name: Trivy - Docker image scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install and build frontend
        run: |
          npm ci
          npm run build -w frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: inventario-backend:scan

      - name: Build frontend image (local only)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:3001
          push: false
          load: true
          tags: inventario-frontend:scan

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inventario-backend:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-dirs: /usr/local/lib/node_modules/npm

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inventario-frontend:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-dirs: /usr/local/lib/node_modules/npm

      - name: Generate backend SARIF report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: inventario-backend:scan
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-dirs: /usr/local/lib/node_modules/npm

      - name: Generate frontend SARIF report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: inventario-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-dirs: /usr/local/lib/node_modules/npm

      - name: Upload backend SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload frontend SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # -------------------------------------------------------------------------
  # 6. Build and push Docker images (solo si todos los gates pasaron)
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs:
      - quality-gates
      - secret-scan
      - snyk-backend
      - sonar-backend
      - trivy-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Extract frontend metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=http://localhost:3001
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}

  # -------------------------------------------------------------------------
  # 7. Deploy (solo en push a default branch y si build-and-push pasó)
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy simulation
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy completed
        run: echo "Aplicación desplegada correctamente"

  # -------------------------------------------------------------------------
  # 8. Monitor del pipeline
  # -------------------------------------------------------------------------
  monitor-pipeline:
    name: Monitor pipeline status
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - secret-scan
      - snyk-backend
      - sonar-backend
      - trivy-scan
      - build-and-push
      - deploy
    if: always()

    steps:
      - name: Show pipeline information
        run: |
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Ejecutado por: ${{ github.actor }}"
          echo "----------------------------------------"
          echo "Resultado quality-gates: ${{ needs.quality-gates.result }}"
          echo "Resultado secret-scan: ${{ needs.secret-scan.result }}"
          echo "Resultado snyk-backend: ${{ needs.snyk-backend.result }}"
          echo "Resultado sonar-backend: ${{ needs.sonar-backend.result }}"
          echo "Resultado trivy-scan: ${{ needs.trivy-scan.result }}"
          echo "Resultado build-and-push: ${{ needs.build-and-push.result }}"
          echo "Resultado deploy: ${{ needs.deploy.result }}"

      - name: Notify successful pipeline
        if: >
          needs.quality-gates.result == 'success' &&
          needs.secret-scan.result == 'success' &&
          needs.snyk-backend.result == 'success' &&
          needs.sonar-backend.result == 'success' &&
          needs.trivy-scan.result == 'success' &&
          needs.build-and-push.result == 'success' &&
          (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
        run: echo "Pipeline CI/CD con DevSecOps finalizado correctamente."

      - name: Notify failed pipeline
        if: >
          needs.quality-gates.result == 'failure' ||
          needs.secret-scan.result == 'failure' ||
          needs.snyk-backend.result == 'failure' ||
          needs.sonar-backend.result == 'failure' ||
          needs.trivy-scan.result == 'failure' ||
          needs.build-and-push.result == 'failure' ||
          needs.deploy.result == 'failure'
        run: |
          echo "El pipeline falló. Revisar logs en GitHub Actions."
          exit 1
