name: CI - Frontend & Backend

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test

  backend-ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: inventario
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client jq

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Prepare backend env for CI
        working-directory: backend
        run: cp .env.test .env

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -prootpass && break
            sleep 2
          done

      - name: Apply DB schema
        run: mysql -h 127.0.0.1 -uroot -prootpass < database/schema.sql

      - name: Apply seed data
        run: mysql -h 127.0.0.1 -uroot -prootpass < database/seed.sql

      - name: Diagnose CI database state
        run: |
          echo "MySQL version and SQL mode:"
          mysql -h 127.0.0.1 -uroot -prootpass -e "SELECT VERSION() AS version, @@sql_mode AS sql_mode;"
          echo "Productos table definition:"
          mysql -h 127.0.0.1 -uroot -prootpass inventario -e "DESCRIBE productos;"
          mysql -h 127.0.0.1 -uroot -prootpass inventario -e "SHOW CREATE TABLE productos\G"
          echo "Seed sanity checks:"
          mysql -h 127.0.0.1 -uroot -prootpass inventario -e "SELECT COUNT(*) AS usuarios_count FROM usuarios;"
          mysql -h 127.0.0.1 -uroot -prootpass inventario -e "SELECT email, rol, activo FROM usuarios ORDER BY id;"
          mysql -h 127.0.0.1 -uroot -prootpass inventario -e "SHOW COLUMNS FROM productos;"

      - name: Start API (background)
        working-directory: backend
        run: |
          node src/server.js > /tmp/backend-ci.log 2>&1 &
          echo $! > /tmp/backend-ci.pid
          sleep 10
          echo "Backend startup log:"
          tail -n 120 /tmp/backend-ci.log || true

      - name: Health check
        run: curl -sSf http://localhost:3001/health

      - name: Login check (admin seed)
        run: |
          curl -sSf -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@inventario.com","password":"123456"}' \
            | grep -q '"token"'

      - name: Login check (empleado seed)
        run: |
          curl -sSf -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"empleado@inventario.com","password":"123456"}' \
            | grep -q '"token"'

      - name: Productos CRUD (admin)
        run: |
          trap 'echo "Backend log on failure:"; tail -n 200 /tmp/backend-ci.log || true' ERR

          # Login admin
          ADMIN_TOKEN=$(curl -s -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@inventario.com","password":"123456"}' \
            | jq -r '.token')

          if [ -z "$ADMIN_TOKEN" ] || [ "$ADMIN_TOKEN" = "null" ]; then
            echo "No se pudo obtener token admin"
            exit 1
          fi

          SKU="SKU-CI-${GITHUB_RUN_ID}"

          echo "=== CREAR PRODUCTO ==="
          CREATE_RESPONSE=$(curl -s -X POST http://localhost:3001/api/productos \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -d "{\"nombre\":\"Arroz\",\"sku\":\"${SKU}\",\"unidad\":\"kg\",\"descripcion\":\"CI\",\"precio\":10.50,\"stock_actual\":5,\"stock_minimo\":1}")

          echo "$CREATE_RESPONSE"

          PRODUCT_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id')

          if [ -z "$PRODUCT_ID" ] || [ "$PRODUCT_ID" = "null" ]; then
            echo "No se pudo crear producto"
            exit 1
          fi

          echo "=== LISTAR PRODUCTOS ==="
          curl -s http://localhost:3001/api/productos \
            -H "Authorization: Bearer ${ADMIN_TOKEN}"

          echo "=== ACTUALIZAR PRODUCTO ==="
          curl -s -X PUT http://localhost:3001/api/productos/${PRODUCT_ID} \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -d '{"precio":11.00}'

          echo "=== ELIMINAR PRODUCTO ==="
          curl -s -X DELETE http://localhost:3001/api/productos/${PRODUCT_ID} \
            -H "Authorization: Bearer ${ADMIN_TOKEN}"

          echo "CRUD completado correctamente"

      - name: Reportes dashboard (admin)
        run: |
          ADMIN_TOKEN=""
          for i in {1..10}; do
            LOGIN_RAW=$(curl -sS -w "\n%{http_code}" -X POST http://localhost:3001/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@inventario.com","password":"123456"}' || true)
            LOGIN_STATUS=$(echo "$LOGIN_RAW" | tail -n 1)
            LOGIN_RESPONSE=$(echo "$LOGIN_RAW" | sed '$d')
            ADMIN_TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.token // empty' 2>/dev/null || true)
            if [ "$LOGIN_STATUS" = "200" ] && [ -n "$ADMIN_TOKEN" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "No se pudo obtener token admin (status: ${LOGIN_STATUS}). Respuesta login:"
            echo "$LOGIN_RESPONSE"
            exit 1
          fi

          curl -sSf http://localhost:3001/api/reportes/dashboard \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            | grep -q 'total'

      - name: Alertas stock bajo (empleado)
        run: |
          EMP_TOKEN=""
          for i in {1..10}; do
            LOGIN_RAW=$(curl -sS -w "\n%{http_code}" -X POST http://localhost:3001/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"empleado@inventario.com","password":"123456"}' || true)
            LOGIN_STATUS=$(echo "$LOGIN_RAW" | tail -n 1)
            LOGIN_RESPONSE=$(echo "$LOGIN_RAW" | sed '$d')
            EMP_TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.token // empty' 2>/dev/null || true)
            if [ "$LOGIN_STATUS" = "200" ] && [ -n "$EMP_TOKEN" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$EMP_TOKEN" ]; then
            echo "No se pudo obtener token empleado (status: ${LOGIN_STATUS}). Respuesta login:"
            echo "$LOGIN_RESPONSE"
            exit 1
          fi

          curl -sSf http://localhost:3001/api/alertas/stock-bajo \
            -H "Authorization: Bearer ${EMP_TOKEN}" \
            | grep -q '\['
