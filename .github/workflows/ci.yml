name: CI Backend

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: inventario
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -prootpass && break
            sleep 2
          done

      - name: Apply DB schema
        run: mysql -h 127.0.0.1 -uroot -prootpass < database/schema.sql

      - name: Apply seed data
        run: mysql -h 127.0.0.1 -uroot -prootpass < database/seed.sql

      - name: Start API (background)
        working-directory: backend
        env:
          PORT: 3001
          CORS_ORIGIN: "*"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: rootpass
          DB_NAME: inventario
          DB_SSL_REQUIRED: "false"
          JWT_SECRET: ci_secret
          JWT_EXPIRES_IN: 1d
          BOOTSTRAP_SECRET: ci_bootstrap
        run: |
          node src/server.js &
          sleep 10

      - name: Health check
        run: curl -sSf http://localhost:3001/health

      - name: Login check (admin seed)
        run: |
          curl -sSf -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@inventario.com","password":"123456"}' \
            | grep -q '"token"'

      - name: Login check (empleado seed)
        run: |
          curl -sSf -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"empleado@inventario.com","password":"123456"}' \
            | grep -q '"token"'

      - name: Productos CRUD (admin)
        run: |
          ADMIN_TOKEN=""
          for i in {1..10}; do
            LOGIN_RESPONSE=$(curl -sS -X POST http://localhost:3001/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@inventario.com","password":"123456"}' || true)
            ADMIN_TOKEN=$(echo "$LOGIN_RESPONSE" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s); process.stdout.write((j&&j.token)||'');}catch{process.stdout.write('');}})")
            if [ -n "$ADMIN_TOKEN" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "No se pudo obtener token admin. Respuesta login:"
            echo "$LOGIN_RESPONSE"
            exit 1
          fi

          CREATED=$(curl -sSf -X POST http://localhost:3001/api/productos \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -d '{"nombre":"Arroz","sku":"SKU-CI-ARROZ","unidad":"kg","descripcion":"CI","precio":10.50,"stock_actual":5,"stock_minimo":1}')

          PRODUCT_ID=$(echo "$CREATED" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          curl -sSf http://localhost:3001/api/productos \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            | grep -q 'SKU-CI-ARROZ'

          curl -sSf -X PUT http://localhost:3001/api/productos/${PRODUCT_ID} \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -d '{"precio":11.00,"unidad":"kg"}' \
            | grep -q '"id"'

          curl -sSf -X DELETE http://localhost:3001/api/productos/${PRODUCT_ID} \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            | grep -q '"activo"'

      - name: Reportes dashboard (admin)
        run: |
          ADMIN_TOKEN=""
          for i in {1..10}; do
            LOGIN_RESPONSE=$(curl -sS -X POST http://localhost:3001/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@inventario.com","password":"123456"}' || true)
            ADMIN_TOKEN=$(echo "$LOGIN_RESPONSE" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s); process.stdout.write((j&&j.token)||'');}catch{process.stdout.write('');}})")
            if [ -n "$ADMIN_TOKEN" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "No se pudo obtener token admin. Respuesta login:"
            echo "$LOGIN_RESPONSE"
            exit 1
          fi

          curl -sSf http://localhost:3001/api/reportes/dashboard \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            | grep -q 'total'

      - name: Alertas stock bajo (empleado)
        run: |
          EMP_TOKEN=""
          for i in {1..10}; do
            LOGIN_RESPONSE=$(curl -sS -X POST http://localhost:3001/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"empleado@inventario.com","password":"123456"}' || true)
            EMP_TOKEN=$(echo "$LOGIN_RESPONSE" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s); process.stdout.write((j&&j.token)||'');}catch{process.stdout.write('');}})")
            if [ -n "$EMP_TOKEN" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$EMP_TOKEN" ]; then
            echo "No se pudo obtener token empleado. Respuesta login:"
            echo "$LOGIN_RESPONSE"
            exit 1
          fi

          curl -sSf http://localhost:3001/api/alertas/stock-bajo \
            -H "Authorization: Bearer ${EMP_TOKEN}" \
            | grep -q '\['
