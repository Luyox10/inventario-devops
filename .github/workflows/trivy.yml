name: Trivy Scan

on:
  push:

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Docker

        run: docker build -t inventario .

      - name: Trivy

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: inventario

          format: table
